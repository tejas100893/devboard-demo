# Goal - To deploy the build images from CI steps once CI workflow is Success


name: CD

# run after CI workflow has completed and the current branch is 'advanced'
on:
    #workflow_run:
    #    workflows: ['CI']
    #    types: [completed]
    #    branches:
     #       - advanced
    workflow_dispatch:

jobs:
    deploy-job:
      if: github.event.workflow_run.conclusion == 'success'
      runs-on: self-hosted
      steps:
        - name: Code checkout
          uses: actions/checkout@v4

        - name: Copy Example env to main env
          run: cp .env.example .env

        - name: Docker Setup [ docker hub login]
          uses: docker/login-action@v4
          with:
              username: ${{ vars.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Deploy the containers with Docker Compose
          run: |
            docker compose pull
            docker compose up -d